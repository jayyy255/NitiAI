version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15  # schema.sql needs the vector extension
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    ports:
      - "4100:4100"
    env_file:
      - .env       
    depends_on:
      - db
    volumes:
      - ./:/app

volumes:
  pgdata:
