name: match-engine

on:
  push:
    paths: ["match_engine/**", "server/**", ".github/workflows/match-engine.yml"]
  pull_request:
    paths: ["match_engine/**", "server/**", ".github/workflows/match-engine.yml"]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: match_engine
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: match_engine/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Unit + API tests (offline)
        run: pytest -q

      - name: Load app schema
        run: psql postgresql://postgres:test@localhost:5432/postgres -q -f ../server/schema/schema.sql
      - name: Postgres + pgvector integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: pytest -q tests/test_integration_pg.py

      - name: Cache ONNX models
        uses: actions/cache@v4
        with:
          path: match_engine/.cache/models
          key: fastembed-bge-small-msmarco-v1
      - name: Retrieval eval (fails if hybrid+rerank NDCG@10 regresses)
        run: python -m eval.run_eval --min-ndcg 0.80
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            match_engine/eval/results.json
            match_engine/eval/results.md
      - name: Eval summary
        run: cat eval/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build Docker image
        run: docker build -t nitiai-match-engine .

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test
        env:
          # tests never touch the DB; an unreachable URL makes the pool fail fast
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
